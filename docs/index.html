<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Architect Prep</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #f0eee8; --border: #e2dfd6;
  --text: #1f1e1b; --muted: #6b675e; --accent: #c4552d; --accent-soft: #f7e3da;
  --ok: #2f7d4f; --ok-soft: #e0f1e6; --bad: #b3382c; --bad-soft: #f8e1de; --warn: #a66a00;
  --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171614; --surface: #211f1c; --surface-2: #2a2824; --border: #3a3732;
    --text: #ecebe6; --muted: #a29d92; --accent: #e07a52; --accent-soft: #3d261c;
    --ok: #6cc28d; --ok-soft: #1d3326; --bad: #ec8073; --bad-soft: #3b211e; --warn: #e0a640;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #171614; --surface: #211f1c; --surface-2: #2a2824; --border: #3a3732;
  --text: #ecebe6; --muted: #a29d92; --accent: #e07a52; --accent-soft: #3d261c;
  --ok: #6cc28d; --ok-soft: #1d3326; --bad: #ec8073; --bad-soft: #3b211e; --warn: #e0a640;
  --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); }
.bar { max-width: 960px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { font-weight: 700; margin-right: auto; cursor: pointer; }
.tabs { display: flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: none; padding: 5px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.tabs button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 10px; }
main { max-width: 960px; margin: 0 auto; padding: 20px 16px 80px; }
h1 { font-size: 24px; margin: 0 0 4px; line-height: 1.25; }
h2 { font-size: 18px; margin: 28px 0 12px; }
h3 { font-size: 15px; margin: 0 0 8px; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); margin-top: 16px; }
.stat .v { font-size: 22px; font-weight: 700; }
.stat .l { color: var(--muted); font-size: 13px; }
.action { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); transition: border-color .15s; }
.action:hover { border-color: var(--accent); }
.action b { display: block; margin-bottom: 2px; }
.action span { color: var(--muted); font-size: 13px; }
.domain { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--border); }
.domain:first-child { border-top: 0; }
.domain .meta { color: var(--muted); font-size: 13px; }
.meter { grid-column: 1 / -1; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.pill { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.qtext { font-size: 16.5px; margin: 14px 0 16px; white-space: pre-wrap; }
.opt { display: flex; gap: 12px; width: 100%; text-align: left; border: 1.5px solid var(--border); background: var(--surface); border-radius: 10px; padding: 11px 14px; margin-bottom: 8px; }
.opt .k { font-weight: 700; min-width: 18px; color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.expl { margin-top: 14px; border-left: 3px solid var(--accent); background: var(--surface-2); padding: 12px 16px; border-radius: 0 10px 10px 0; }
.expl p { margin: 0 0 8px; } .expl ul { margin: 0; padding-left: 20px; }
.verdict { font-weight: 700; margin-bottom: 6px; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.progress { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 10px 0 0; }
.progress i { display: block; height: 100%; background: var(--accent); }
.navgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; }
.navgrid button { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 5px 0; font-size: 13px; position: relative; }
.navgrid button.ans { background: var(--accent-soft); border-color: var(--accent); }
.navgrid button.cur { outline: 2px solid var(--text); }
.navgrid button.flag::after { content: ""; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.navgrid button.ok { background: var(--ok-soft); border-color: var(--ok); }
.navgrid button.bad { background: var(--bad-soft); border-color: var(--bad); }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; }
.timer.low { color: var(--bad); }
.score { font-size: 44px; font-weight: 800; line-height: 1; }
.pass { color: var(--ok); } .fail { color: var(--bad); }
.concept { padding: 10px 0; border-top: 1px solid var(--border); }
.concept:first-of-type { border-top: 0; }
.concept b { display: block; }
details { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 0 16px; margin-bottom: 8px; }
summary { cursor: pointer; padding: 12px 0; font-weight: 600; }
details[open] summary { border-bottom: 1px solid var(--border); margin-bottom: 10px; }
details > div { padding-bottom: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chips button { border: 1px solid var(--border); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 13px; }
.chips button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
select { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
code { font: 0.9em ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
a.pill { text-decoration: none; } a.pill:hover { color: var(--accent); }
.pill.strong { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.match { display: grid; gap: 10px; }
.match-row { border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; display: grid; gap: 8px; }
.match-row.ok { border-color: var(--ok); background: var(--ok-soft); }
.match-row.bad { border-color: var(--bad); background: var(--bad-soft); }
.match-row select { width: 100%; }
.match-fix { font-size: 13px; color: var(--ok); font-weight: 600; }
.src-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); cursor: pointer; }
.src-row:first-child { border-top: 0; }
.src-row a { font-size: 13px; }
.search { flex: 1; min-width: 160px; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
#check { margin-top: 6px; }
.unlock { max-width: 420px; margin: 40px auto; }
.unlock .search { width: 100%; }
@media (max-width: 600px) { .qtext { font-size: 15.5px; } h1 { font-size: 21px; } }
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand">Claude Architect Prep</div>
  <div class="tabs" id="certTabs"></div>
  <button class="icon-btn" id="themeBtn" title="Đổi giao diện sáng/tối">◐</button>
</div></header>
<main id="view"></main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
